version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: civicconnect-db
    restart: always
    environment:
      POSTGRES_USER: civic_admin
      POSTGRES_PASSWORD: civic_password_2026
      POSTGRES_DB: civicconnect
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civicconnect-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://civic_admin:civic_password_2026@db:5432/civicconnect
      SECRET_KEY: civicconnect-production-secret-token-key-2026
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: gemini-2.0-flash
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civicconnect-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
